<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>World Free TV – Live Public Channels</title>

  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --surface2: #242830;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #2d323c;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 span { color: var(--accent); }
    .badge {
      font-size: 0.7rem;
      background: var(--success);
      color: #000;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .cat-btn {
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .channel-item:hover { background: var(--surface2); }
    .channel-item.active {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .channel-logo {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: contain;
      background: var(--surface2);
      flex-shrink: 0;
    }
    .channel-info { flex: 1; min-width: 0; }
    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-group {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    /* Player area */
    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .now-playing {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 40px 24px 20px;
      pointer-events: none;
    }
    .now-playing h2 {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .now-playing p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .placeholder svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.4;
    }
    .placeholder h2 {
      font-size: 1.5rem;
      color: var(--text);
      margin-bottom: 8px;
    }
    .placeholder p { max-width: 400px; line-height: 1.5; }
    /* Footer note */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      flex-shrink: 0;
    }
    footer a { color: var(--accent); text-decoration: none; }
    /* Mobile */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .player-area { height: 60vh; }
    }
  </style>
</head>

    let currentHls = null;
    let activeCat = "all";
    let searchQuery = "";

    const video = document.getElementById("video");
    const channelList = document.getElementById("channelList");
    const placeholder = document.getElementById("placeholder");
    const nowPlaying = document.getElementById("nowPlaying");
    const npName = document.getElementById("npName");
    const npGroup = document.getElementById("npGroup");

    function renderChannels() {
      const filtered = channels.filter(ch => {
        const matchCat = activeCat === "all" || ch.group === activeCat;
        const matchSearch = !searchQuery || ch.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      channelList.innerHTML = filtered.map((ch, i) => `
        <div class="channel-item" data-idx="${channels.indexOf(ch)}">
          <img class="channel-logo" src="${ch.logo}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23242830%22 width=%2240%22 height=%2240%22 rx=%226%22/><text x=%2220%22 y=%2226%22 text-anchor=%22middle%22 fill=%22%239ca3af%22 font-size=%2214%22>TV</text></svg>'">
          <div class="channel-info">
            <div class="channel-name">${ch.name}</div>
            <div class="channel-group">${ch.group}</div>
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".channel-item").forEach(el => {
        el.addEventListener("click", () => playChannel(parseInt(el.dataset.idx)));
      });
    }

    function playChannel(idx) {
      const ch = channels[idx];
      if (!ch) return;

      // Highlight active
      document.querySelectorAll(".channel-item").forEach(el => el.classList.remove("active"));
      const activeEl = document.querySelector(`.channel-item[data-idx="${idx}"]`);
      if (activeEl) activeEl.classList.add("active");

      placeholder.style.display = "none";
      nowPlaying.style.display = "block";
      npName.textContent = ch.name;
      npGroup.textContent = ch.group + " • Live";

      // Clean previous
      if (currentHls) {
        currentHls.destroy();
        currentHls = null;
      }
      video.src = "";

      if (Hls.isSupported()) {
        currentHls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
        });
        currentHls.loadSource(ch.url);
        currentHls.attachMedia(video);
        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
        currentHls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error("Stream error:", data);
            npGroup.textContent = "Stream unavailable – try another channel";
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari native HLS
        video.src = ch.url;
        video.addEventListener("loadedmetadata", () => video.play().catch(() => {}));
      } else {
        npGroup.textContent = "Your browser does not support HLS streams";
      }
    }

    // Category buttons
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        renderChannels();
      });
    });

    // Search
    document.getElementById("search").addEventListener("input", e => {
      searchQuery = e.target.value;
      renderChannels();
    });

    // Init
    renderChannels();
  </script>
